<!DOCTYPE html>
<html lang="en">
  <head>
    <title></title>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <link href="assets/styles/sign.css" rel="stylesheet">
  </head>
  <body>
    <div class="background">
      <div class="container">
        <div class="left"></div>
        <div class="middle">
          <header>
            <div class="first__image">
              <a href="dashboard.html"><img src="assets/img/bf5a46be-a886-42cd-8c69-b421a9ded26a-removebg-preview.png" alt="ilovetaguig"></a>
             
            </div>
            <div class="title blue">
              <h2><strong>CITY OF TAGUIG</strong></h2>
            </div>
            <div class="subtitle blue">
              <h3><strong>TAGUIG CITIZEN'S PORTAL</strong></h3>
            </div>
            <div class="second__image">
              <img src="assets/img/image-removebg-preview (1).png" alt="City of Taguig">
            </div>
          </header>
            
          <form action="">
            <div class="signin__head">
              <h1 class="red"><strong>SIGN IN</strong></h1>
              <p class="blue">STAY CONNECTED WITH US.</p>
            </div>
            <br>
            <div class="input__container">
              <label for="email">EMAIL:</label>
              <br>
              <input type="email" id="email" name="email" required>
            </div>
            <div class="input__container">
              <label for="password">PASSWORD:</label>
              <br>
              <input type="password" id="password" name="password" required>
            </div>
            <div class="remember__container">
              <input type="checkbox" id="remember" name="remember" required>
              <label for="remember">Remember Me</label>
            </div>
            <div class="button__container">
              <input class="submit__button" type="submit" value="SIGN IN">
            </div>
            <div class="forgot__password">
              <a href="#">Forgot Password?</a>
            </div>
  
            <div class="or">
              <div class="spacing">
                <hr>
              </div>
              <div class="orio">
                <p>Or</p>
              </div>
              <div class="spacing">
                <hr>
              </div>
            </div>
          </form>
  
          <footer>
            <div class="social__media">
              <a href="#"><img class="facebook" src="assets/img/facebook-color-svgrepo-com.svg" alt="Facebook"></a>
              <a href="#"><img class="apple" src="assets/img/image-removebg-preview (2).png" alt="Apple"></a>
              <a href="#"><img class="google" src="assets/img/image-removebg-preview (3).png" alt="Google"></a>
            </div>
            <div class="signup__link">
              Don't have an account? <a href="signup.html">Sign Up</a>
            </div>
          </footer>
        </div>
        <div class="right"></div>
      </div>
    </div>
  </body>
</html>
