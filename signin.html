<!DOCTYPE html>
<html lang="en">
  <head>
    <title></title>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <link href="assets/styles/signin.css" rel="stylesheet">
  </head>
  <body>
    <div class="background">
      <div class="container">
        <div class="left"></div>
        <header>
          <div class="first__image">
            <img src="assets/img/bf5a46be-a886-42cd-8c69-b421a9ded26a-removebg-preview.png" alt="ilovetaguig">
           
          </div>
          <div class="title blue">
            <h2><strong>CITY OF TAGUIG</strong></h2>
          </div>
          <div class="subtitle blue">
            <h3><strong>TAGUIG CITIZEN'S PORTAL</strong></h3>
          </div>
          <div class="second__image">
            <img src="assets/img/image-removebg-preview (1).png" alt="City of Taguig">
          </div>
        </header>
          
        <form action="">
          <h1 class="red"><strong>SIGN IN</strong></h1>
          <p class="blue">STAY CONNECTED WITH US.</p>
          <br>
          <div class="input__container">
            <label for="email">EMAIL:</label>
            <br>
            <input type="email" id="email" name="email" required>
          </div>
          <div class="input__container">
            <label for="password">PASSWORD:</label>
            <br>
            <input type="password" id="password" name="password" required>
          </div>
          <div class="remember__container">
            <input type="checkbox" id="remember" name="remember" required>
            <label for="remember">Remember Me</label>
          </div>
          <div class="button__container">
            <input class="submit__button" type="submit" value="SIGN IN">
          </div>
          <div class="forgot__password">
            <a href="#">Forgot Password?</a>
          </div>

          <div class="or">
            <div class="spacing">
              <hr>
            </div>
            <div class="or">
              <p>Or</p>
            </div>
            <div class="spacing">
              <hr>
            </div>
          </div>
        </form>

        <footer>
          <div class="social__media">
            <a href="#"><img src="assets/img/facebook.png" alt="Facebook"></a>
            <a href="#"><img src="assets/img/twitter.png" alt="Twitter"></a>
            <a href="#"><img src="assets/img/instagram.png" alt="Instagram"></a>
          </div>
          <div class="signup__link">
            Don't have an account? <a href="#">Sign Up</a>
          </div>
        </footer>
        <div class="right"></div>
      </div>
    </div>
  </body>
</html>
